plugins { id 'com.android.application' }
android {
    namespace 'com.pratik.imagetap'
    compileSdk 35
    defaultConfig { applicationId 'com.pratik.imagetap.v7'; minSdk 30; targetSdk 35; versionCode 24; versionName '7.4'; ndk { abiFilters 'arm64-v8a', 'x86_64' } }
    signingConfigs { personal { storeFile file("../signing/development.jks"); storePassword "android"; keyAlias "imagetap-v7"; keyPassword "android" } }
    buildTypes { debug { signingConfig signingConfigs.personal } }
    testOptions { unitTests.includeAndroidResources = true; unitTests.all { systemProperty "robolectric.dependency.repo.url", "https://repo.maven.apache.org/maven2"; ["https.proxyHost","https.proxyPort","http.proxyHost","http.proxyPort","javax.net.ssl.trustStore"].each { key -> if (System.getProperty(key)) systemProperty key, System.getProperty(key) } } }
    packaging { jniLibs { useLegacyPackaging = true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'org.opencv:opencv:4.12.0'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.robolectric:robolectric:4.14.1' }
